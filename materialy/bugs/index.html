<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ćwiczenie z debuggerem – TaskBoard</title>

  <!-- defer uruchamia skrypt po sparsowaniu HTML, więc elementy DOM będą już dostępne. -->
  <script src="bugs.js" defer></script>
</head>
<body>
  <main>
    <h1>Podsumowanie zadań</h1>
    <p>Po kliknięciu przycisku powinien pojawić się napis: „Wykonane: 2 z 5 (40%)”.</p>

    <!-- Id "policz" musi być taki sam jak w getElementById() w pliku bugs.js. -->
    <button type="button" id="policz">Policz wykonane zadania</button>

    <!-- Id "wynik" wskazuje miejsce, w którym JavaScript wyświetla podsumowanie.
         aria-live="polite" informuje czytniki ekranu o aktualizacji wyniku. -->
    <p id="wynik" aria-live="polite"></p>
  </main>
</body>
</html>
