<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TaskBoard — tablice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body>
<nav class="navbar navbar-dark app-navbar"><div class="container-fluid"><a class="navbar-brand" href="boards.html">TaskBoard</a><div class="d-flex align-items-center gap-3"><span class="navbar-text">Zalogowano: <strong id="userName"></strong></span><button type="button" class="btn btn-outline-light btn-sm" id="logoutBtn">Wyloguj</button></div></nav>
<main class="container-fluid page-wrap"><div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"><h1 class="h3 mb-0">Tablice</h1><button type="button" class="btn btn-primary" id="newBoardBtn">Nowa tablica</button></div><div id="pageMessage" aria-live="polite" aria-atomic="true"></div><div class="row g-3" id="boardsList"></div><div class="empty-state d-none" id="emptyBoards">Nie masz jeszcze żadnej tablicy. Utwórz pierwszą!</div></main>
<div class="modal fade" id="boardModal" tabindex="-1" aria-hidden="true" aria-labelledby="boardModalTitle"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="boardForm" novalidate><div class="modal-header"><h2 class="modal-title fs-5" id="boardModalTitle">Nowa tablica</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div><div class="modal-body"><div id="boardFormMessage" class="text-danger mb-2" role="alert" aria-live="polite"></div><label class="form-label" for="boardName">Nazwa</label><input class="form-control mb-1" id="boardName" required maxlength="80" aria-describedby="boardNameHelp"><div class="form-text" id="boardNameHelp">Od 1 do 80 znaków.</div><div class="invalid-feedback">Podaj nazwę tablicy (maksymalnie 80 znaków).</div><label class="form-label mt-3" for="boardDescription">Opis (opcjonalnie)</label><textarea class="form-control" id="boardDescription" rows="3" maxlength="255"></textarea><div class="invalid-feedback">Opis może mieć maksymalnie 255 znaków.</div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button><button class="btn btn-primary" type="submit">Zapisz tablicę</button></div></form></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/boards.js"></script></body></html>
