<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard — tablica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark app-navbar"><div class="container-fluid"><a class="navbar-brand" href="boards.html">TaskBoard</a><div class="d-flex align-items-center gap-3"><span class="navbar-text">Zalogowano: <strong id="userName"></strong></span><button type="button" class="btn btn-outline-light btn-sm" id="logoutBtn">Wyloguj</button></div></div></nav>
  <main class="container-fluid page-wrap">
    <nav class="mb-2" aria-label="breadcrumb"><a href="boards.html">Tablice</a><span class="text-muted mx-2" aria-hidden="true">/</span><span id="breadcrumbName">Tablica</span></nav>
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3"><div><h1 class="h3 mb-1" id="boardTitle">Tablica</h1><p class="text-secondary mb-0" id="boardDescription"></p></div><button type="button" class="btn btn-primary" id="newTaskBtn">Dodaj zadanie</button></div>
    <div id="pageMessage" aria-live="polite" aria-atomic="true"></div>
    <section class="row g-2 filter-row mb-3" aria-label="Filtry zadań">
      <div class="col-12 col-md-3"><label class="form-label" for="filterPriority">Priorytet</label><select class="form-select" id="filterPriority"><option value="">Wszystkie</option><option value="high">Wysoki</option><option value="medium">Średni</option><option value="low">Niski</option></select></div>
      <div class="col-12 col-md-3"><label class="form-label" for="filterAssignee">Osoba</label><select class="form-select" id="filterAssignee"><option value="">Wszyscy</option></select></div>
      <div class="col-12 col-md-4"><label class="form-label" for="filterQuery">Szukaj w tytułach</label><input class="form-control" id="filterQuery" type="search" placeholder="np. README" maxlength="100" autocomplete="off"></div>
      <div class="col-12 col-md-2 d-flex align-items-end"><button type="button" class="btn btn-outline-secondary w-100" id="clearFilters">Wyczyść filtry</button></div>
    </section>
    <div class="row g-3 kanban-row">
      <section class="col-12 col-lg-4" aria-labelledby="heading-todo"><div class="kanban-column todo-column"><div class="column-heading"><h2 id="heading-todo">Do zrobienia</h2><span class="badge text-bg-light" id="count-todo" aria-label="Liczba zadań">0</span></div><div class="task-list" id="col-todo" aria-live="polite"></div></div></section>
      <section class="col-12 col-lg-4" aria-labelledby="heading-progress"><div class="kanban-column progress-column"><div class="column-heading"><h2 id="heading-progress">W trakcie</h2><span class="badge text-bg-light" id="count-in_progress" aria-label="Liczba zadań">0</span></div><div class="task-list" id="col-in_progress" aria-live="polite"></div></div></section>
      <section class="col-12 col-lg-4" aria-labelledby="heading-done"><div class="kanban-column done-column"><div class="column-heading"><h2 id="heading-done">Gotowe</h2><span class="badge text-bg-light" id="count-done" aria-label="Liczba zadań">0</span></div><div class="task-list" id="col-done" aria-live="polite"></div></div></section>
    </div>
  </main>
  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true" aria-labelledby="taskModalTitle"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
    <form id="taskForm" novalidate><div class="modal-header"><h2 class="modal-title fs-5" id="taskModalTitle">Nowe zadanie</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div>
      <div class="modal-body"><div id="taskFormMessage" class="text-danger mb-2" role="alert" aria-live="polite"></div><div class="mb-3"><label class="form-label" for="taskTitle">Tytuł</label><input class="form-control" id="taskTitle" required minlength="3" maxlength="100" aria-describedby="taskTitleHelp"><div class="form-text" id="taskTitleHelp">Od 3 do 100 znaków.</div><div class="invalid-feedback">Tytuł musi mieć od 3 do 100 znaków.</div></div>
      <div class="mb-3"><label class="form-label" for="taskDescription">Opis (opcjonalnie)</label><textarea class="form-control" id="taskDescription" rows="3" maxlength="5000"></textarea><div class="invalid-feedback">Opis może mieć maksymalnie 5000 znaków.</div></div>
      <div class="row g-3"><div class="col-md-6"><label class="form-label" for="taskStatus">Status</label><select class="form-select" id="taskStatus"><option value="todo">Do zrobienia</option><option value="in_progress">W trakcie</option><option value="done">Gotowe</option></select></div>
      <div class="col-md-6"><label class="form-label" for="taskPriority">Priorytet</label><select class="form-select" id="taskPriority"><option value="low">Niski</option><option value="medium" selected>Średni</option><option value="high">Wysoki</option></select></div>
      <div class="col-md-6"><label class="form-label" for="taskDeadline">Termin (opcjonalnie)</label><input class="form-control" type="date" id="taskDeadline"><div class="invalid-feedback">Podaj prawidłowy termin.</div></div>
      <div class="col-md-6"><label class="form-label" for="taskAssignee">Osoba (opcjonalnie)</label><select class="form-select" id="taskAssignee"><option value="">Nieprzypisane</option></select></div></div>
      <p class="small text-secondary mt-3 mb-0 d-none" id="taskCreatedAt"></p></div>
      <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Anuluj</button><button class="btn btn-primary" type="submit">Zapisz zadanie</button></div>
    </form>
  </div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/board.js"></script>
</body></html>
